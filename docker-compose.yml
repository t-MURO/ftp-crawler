name: ftp-indexer

x-ftp-indexer: &ftp-indexer
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  volumes:
    - ftp_indexer_data:/data
    - ftp_indexer_config:/config
    - ftp_indexer_logs:/logs
  init: true

services:
  migrate:
    <<: *ftp-indexer
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"

  web:
    <<: *ftp-indexer
    command: ["python", "-m", "app.run_web"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HOST_PORT:-11025}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  crawler:
    <<: *ftp-indexer
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 90s
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  ftp_indexer_data:
    name: ftp-indexer-data
  ftp_indexer_config:
    name: ftp-indexer-config
  ftp_indexer_logs:
    name: ftp-indexer-logs
