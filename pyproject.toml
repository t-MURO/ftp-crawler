[project]
name = "port-browser"
version = "1.0.0"
description = "A resumable FTP/FTPS metadata crawler and fast searchable web index."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "Jinja2>=3.1.5,<4",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26",
  "croniter>=6.0,<7",
  "itsdangerous>=2.2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
